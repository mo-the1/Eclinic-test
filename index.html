<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Clinic System</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background:#000; color:#fff; font-family:Arial, sans-serif; margin:0; }
  .container { max-width:420px; margin:0 auto; padding:24px; }
  input { width:100%; box-sizing:border-box; background:#111; border:1px solid #333;
    border-radius:8px; padding:12px; color:#fff; margin-bottom:10px; font-size:14px; }
  button { width:100%; background:#fff; color:#000; border:none; border-radius:8px;
    padding:12px; font-weight:bold; font-size:14px; cursor:pointer; }
  .card { border:1px solid #333; border-radius:8px; padding:12px 16px; margin-bottom:8px;
    display:flex; justify-content:space-between; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ====== حط بياناتك هنا ======
const SUPABASE_URL = "https://mfrveljsifglheyrmgbi.supabase.co";
const SUPABASE_KEY = "sb_publishable_15xYpC6dNvCzbvUi9vuPfQ__xOua0NS";
// ============================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function App() {
  const [patients, setPatients] = useState([]);
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [age, setAge] = useState("");
  const [loading, setLoading] = useState(false);

  const loadPatients = async () => {
    const { data, error } = await supabase
      .from("patients")
      .select("*")
      .order("created_at", { ascending: false });
    if (error) console.error(error);
    else setPatients(data);
  };

  useEffect(() => { loadPatients(); }, []);

  const handleSave = async () => {
    if (!name.trim() || !phone.trim()) return;
    setLoading(true);
    const nextDate = new Date();
    nextDate.setDate(nextDate.getDate() + 7);

    const { error } = await supabase.from("patients").insert([{
      name, phone, age: age ? parseInt(age) : null,
      next_appointment: nextDate.toISOString().split("T")[0]
    }]);

    if (error) alert("حصل خطأ: " + error.message);
    else {
      setName(""); setPhone(""); setAge("");
      loadPatients();
    }
    setLoading(false);
  };

  return (
    <div className="container">
      <h2>تسجيل مريضة جديدة</h2>
      <input placeholder="الاسم" value={name} onChange={e => setName(e.target.value)} />
      <input placeholder="رقم الموبايل" value={phone} onChange={e => setPhone(e.target.value)} />
      <input placeholder="السن" value={age} onChange={e => setAge(e.target.value)} />
      <button onClick={handleSave} disabled={loading}>
        {loading ? "جاري الحفظ..." : "Save"}
      </button>

      <h3 style={{marginTop:"30px"}}>المريضات ({patients.length})</h3>
      {patients.map(p => (
        <div className="card" key={p.id}>
          <span>{p.name}</span>
          <span style={{color:"#888"}}>{p.phone}</span>
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
